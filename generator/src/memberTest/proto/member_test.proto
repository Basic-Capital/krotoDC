syntax = "proto3";

package com.example.membertest;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  BLUE = 2;
}

message Person {
  message Address {
    string city = 1;
  }
  string name = 1;
  int32 age = 2;
  optional string nickname = 3;
  Address home = 4;
  repeated Address previous = 5;
  map<string, Address> by_label = 6;
  map<string, int64> counters = 7;
  Color favorite_color = 8;
  google.protobuf.Timestamp born = 9;
  oneof contact {
    string email = 10;
    Address mailing = 11;
  }
}

message Empty {}

message Envelope {
  string sender_name = 1;
  google.protobuf.Any payload = 2;
}

service PersonService {
  rpc GetPerson(Person) returns (Person);
  rpc ListHTTPAddresses(Person) returns (stream Person.Address);
  rpc UploadPeople(stream Person) returns (Empty);
  rpc Chat(stream Person) returns (stream Person);
}
