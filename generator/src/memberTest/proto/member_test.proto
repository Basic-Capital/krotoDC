syntax = "proto3";

package com.example.membertest;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum Color {
  COLOR_UNSPECIFIED = 0;
  RED = 1;
  BLUE = 2;
}

message Person {
  message Address {
    string city = 1;
  }
  string name = 1;
  int32 age = 2;
  optional string nickname = 3;
  Address home = 4;
  repeated Address previous = 5;
  map<string, Address> by_label = 6;
  map<string, int64> counters = 7;
  Color favorite_color = 8;
  google.protobuf.Timestamp born = 9;
  oneof contact {
    string email = 10;
    Address mailing = 11;
  }
}

message Empty {}

message Envelope {
  string sender_name = 1;
  google.protobuf.Any payload = 2;
}

// Every field shape the converters handle, so both converter styles are exercised on all of them.
message AllShapes {
  google.protobuf.Int32Value wrapped_int = 1;
  google.protobuf.StringValue wrapped_string = 2;
  repeated google.protobuf.Int64Value wrapped_longs = 3;
  google.protobuf.Empty nothing = 4;
  repeated Color colors = 5;
  map<int32, Color> color_by_id = 6;
  map<string, google.protobuf.Timestamp> times = 7;
  repeated google.protobuf.Timestamp moments = 8;
  optional Person.Address maybe_address = 9;
  optional int64 maybe_count = 10;
  bytes blob = 11;
  repeated string tags = 12;
  google.protobuf.Duration wait = 13;
  string class = 14;
  int32 in = 15;
  oneof choice {
    google.protobuf.Timestamp at = 16;
    Color hue = 18;
    Person.Address place = 19;
  }
  repeated Person people = 20;
  map<string, google.protobuf.StringValue> labels = 21;
  map<string, Person.Address> else = 22;
  repeated Person.Address for = 23;
  repeated bytes chunks = 24;
  map<string, bytes> blobs = 25;
  repeated google.protobuf.Duration waits = 26;
}

service PersonService {
  rpc GetPerson(Person) returns (Person);
  rpc ListHTTPAddresses(Person) returns (stream Person.Address);
  rpc UploadPeople(stream Person) returns (Empty);
  rpc Chat(stream Person) returns (stream Person);
}
