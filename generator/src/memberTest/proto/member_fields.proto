syntax = "proto3";

package com.example.memberfields;

import "google/protobuf/any.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

enum Status {
  STATUS_UNSPECIFIED = 0;
  ACTIVE = 1;
  CLOSED = 2;
}

// Every field shape fieldAccessors handles. The oneof sits mid-message and `late` is declared before fields with
// lower numbers, so declaration order differs from number order.
message Ledger {
  message Owner {
    string name = 1;
    int32 age = 2;
  }
  string id = 1;
  int32 count = 2;
  int64 total = 3;
  double ratio = 4;
  float weight = 5;
  bool active = 6;
  bytes token = 7;
  Status status = 8;
  optional string nickname = 9;
  optional int32 limit = 10;
  optional Status previous_status = 11;
  Owner owner = 12;
  repeated string tags = 13;
  repeated Owner co_owners = 14;
  map<string, int64> balances = 15;
  map<string, Owner> owners_by_role = 16;
  oneof contact {
    string email = 17;
    Owner delegate = 18;
    google.protobuf.Timestamp contact_after = 19;
  }
  string late = 40;
  google.protobuf.Timestamp opened_at = 20;
  google.protobuf.Duration grace = 21;
  google.protobuf.Int32Value wrapped_limit = 22;
  repeated google.protobuf.Duration waits = 23;
  google.protobuf.Any extra = 24;
  repeated Status history = 25;
  optional Owner backup_owner = 26;
}

// A nested type named Fields takes the name, so the accessor object is KrotoFields. The nested message itself is
// named Fields, so its own accessor object is KrotoFields too.
message Catalog {
  message Fields {
    string label = 1;
  }
  Fields fields = 1;
  repeated Fields extra = 2;
}

// A oneof named `fields` generates a sealed interface named Fields, so the accessor object is KrotoFields.
message Picker {
  oneof fields {
    string text = 1;
    int32 index = 2;
  }
}

// Mutually recursive messages, so their accessor objects reference each other's companions.
message Folder {
  string name = 1;
  repeated Document documents = 2;
  optional Document readme = 3;
}

message Document {
  string title = 1;
  optional Folder parent = 2;
  repeated Folder links = 3;
}

message NoFields {}
