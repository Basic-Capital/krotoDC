syntax = "proto3";

package com.example.membertest.options;

import "google/protobuf/descriptor.proto";

enum Access {
  ACCESS_UNSPECIFIED = 0;
  READ = 1;
  WRITE = 2;
}

message Tag {
  string value = 1;
}

extend google.protobuf.MethodOptions {
  optional Access access = 51001;
  optional string method_note = 51002;
}

extend google.protobuf.FieldOptions {
  optional bool sensitive = 51003;
  repeated string field_labels = 51004;
}

extend google.protobuf.EnumValueOptions {
  optional int32 legacy_number = 51005;
  optional int64 big_number = 51006;
}

extend google.protobuf.MessageOptions {
  optional Tag tag = 51007;
}

message Account {
  option (tag) = { value: "account" };
  string id = 1;
  string secret = 2 [(sensitive) = true, (field_labels) = "pii", (field_labels) = "secret"];
  Kind kind = 3;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    SAVINGS = 1 [(legacy_number) = 7, (big_number) = 9000000000];
  }
}

service AccountService {
  rpc GetAccount(Account) returns (Account) {
    option (access) = READ;
    option (method_note) = "reads an account";
  }
  rpc PutAccount(Account) returns (Account);
}
